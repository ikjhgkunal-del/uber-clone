events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream authentication_backend { server authentication-service:3001; }
  upstream customer_backend       { server customer-service:3002; }
  upstream driver_backend         { server driver-service:3003; }
  upstream ride_backend           { server ride-service:3004; }
  upstream payment_backend        { server payment-service:3005; }
  upstream realtime_backend       { server realtime-service:3006; }
  upstream web_backend            { server web:80; }

  server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    location = /health {
      default_type application/json;
      return 200 '{"service":"api-gateway","status":"ok"}';
    }

    location /api/auth/ {
      proxy_pass http://authentication_backend/;
      include /etc/nginx/proxy_params;
    }

    location /api/customers/ {
      proxy_pass http://customer_backend/;
      include /etc/nginx/proxy_params;
    }

    location /api/drivers/ {
      proxy_pass http://driver_backend/;
      include /etc/nginx/proxy_params;
    }

    location /api/rides/ {
      proxy_pass http://ride_backend/;
      include /etc/nginx/proxy_params;
    }

    location /api/payments/ {
      proxy_pass http://payment_backend/;
      include /etc/nginx/proxy_params;
    }

    location = /ws {
      proxy_pass http://realtime_backend/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://web_backend;
      include /etc/nginx/proxy_params;
    }
  }
}
