name: uber-clone

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  networks:
    - backend
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s

x-backend-build: &backend-build
  context: .
  dockerfile_inline: |
    FROM node:22-alpine AS build
    WORKDIR /workspace
    COPY package.json package-lock.json ./
    COPY tsconfig.base.json ./
    COPY backend ./backend
    RUN npm ci
    ARG SERVICE_NAME
    RUN npm run build --workspace=@uber-clone/shared
    RUN npm run build --workspace=@uber-clone/$${SERVICE_NAME}
    RUN npm ci --omit=dev --workspace=@uber-clone/$${SERVICE_NAME} --include-workspace-root=false
    FROM node:22-alpine AS runtime
    ENV NODE_ENV=production
    WORKDIR /app
    ARG SERVICE_NAME
    COPY --from=build /workspace/node_modules ./node_modules
    COPY --from=build /workspace/backend/$${SERVICE_NAME}/package.json ./package.json
    COPY --from=build /workspace/backend/$${SERVICE_NAME}/dist ./dist
    COPY --from=build /workspace/backend/shared/dist ./backend/shared/dist
    COPY --from=build /workspace/backend/shared/package.json ./backend/shared/package.json
    COPY database/migrations /app/database/migrations
    USER node
    EXPOSE 3000
    CMD ["node", "dist/index.js"]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: uber_clone
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/migrations:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    profiles: [full]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka-volume-init:
    profiles: [full]
    image: apache/kafka:4.4.0
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1000:1000 /var/lib/kafka/data"]
    volumes:
      - kafka_data:/var/lib/kafka/data
    network_mode: none
    restart: "no"

  kafka:
    profiles: [full]
    image: apache/kafka:4.4.0
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - backend

  auth-service:
    <<: *service-defaults
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: auth-service
    environment:
      SERVICE_NAME: auth-service
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-Uber Clone <no-reply@example.test>}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/auth/google/callback}
      DB_SCHEMA: auth
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    <<: *service-defaults
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: user-service
    environment:
      SERVICE_NAME: user-service
      PORT: 3002
      AUTH_SERVICE_URL: http://auth-service:3001
      DB_SCHEMA: users
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
    depends_on:
      auth-service:
        condition: service_healthy
      postgres:
        condition: service_healthy

  driver-service:
    profiles: [full]
    <<: *service-defaults
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: driver-service
    environment:
      SERVICE_NAME: driver-service
      PORT: 3003
      DB_SCHEMA: drivers
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ride-service:
    profiles: [full]
    <<: *service-defaults
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: ride-service
    environment:
      SERVICE_NAME: ride-service
      PORT: 3004
      DB_SCHEMA: rides
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:19092}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    profiles: [full]
    <<: *service-defaults
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: payment-service
    environment:
      SERVICE_NAME: payment-service
      PORT: 3005
      DB_SCHEMA: payments
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:19092}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  realtime-service:
    profiles: [full]
    <<: *service-defaults
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: realtime-service
    environment:
      SERVICE_NAME: realtime-service
      PORT: 3006
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:19092}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    profiles: [full]
    <<: *service-defaults
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: notification-service
    environment:
      SERVICE_NAME: notification-service
      PORT: 3007
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:19092}
    depends_on:
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY index.html vite.config.js ./
        COPY src ./src
        RUN npm run build
        FROM nginx:stable-alpine
        COPY --from=build /app/dist /usr/share/nginx/html
    volumes:
      - ./infrastructure/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend
    restart: unless-stopped

  api-gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      auth-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/proxy_params:/etc/nginx/proxy_params:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  backend:
    driver: bridge
