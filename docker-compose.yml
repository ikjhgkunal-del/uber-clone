name: uber-clone

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  networks:
    - backend
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s

x-backend-build: &backend-build
  context: .
  dockerfile_inline: |
    FROM node:22-alpine AS build
    WORKDIR /workspace
    COPY package.json package-lock.json ./
    COPY tsconfig.base.json ./
    COPY backend ./backend
    RUN npm ci
    ARG SERVICE_NAME
    RUN npm run build --workspace=@uber-clone/$${SERVICE_NAME}
    FROM node:22-alpine AS runtime
    ENV NODE_ENV=production
    WORKDIR /app
    ARG SERVICE_NAME
    COPY --from=build /workspace/node_modules ./node_modules
    COPY --from=build /workspace/backend/$${SERVICE_NAME}/package.json ./package.json
    COPY --from=build /workspace/backend/$${SERVICE_NAME}/dist ./dist
    USER node
    EXPOSE 3000
    CMD ["node", "dist/index.js"]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev2026}
      POSTGRES_DB: uber_clone
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/migrations:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  auth-service:
    <<: *service-defaults
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: auth-service
    environment:
      SERVICE_NAME: auth-service
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      DB_SCHEMA: auth
      DATABASE_URL: ${DATABASE_URL:-postgres://uber:localdev2026@postgres:5432/uber_clone}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    <<: *service-defaults
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: user-service
    environment:
      SERVICE_NAME: user-service
      PORT: 3002
      DB_SCHEMA: users
      DATABASE_URL: ${DATABASE_URL:-postgres://uber:localdev2026@postgres:5432/uber_clone}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy

  driver-service:
    <<: *service-defaults
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: driver-service
    environment:
      SERVICE_NAME: driver-service
      PORT: 3003
      DB_SCHEMA: drivers
      DATABASE_URL: ${DATABASE_URL:-postgres://uber:localdev2026@postgres:5432/uber_clone}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ride-service:
    <<: *service-defaults
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: ride-service
    environment:
      SERVICE_NAME: ride-service
      PORT: 3004
      DB_SCHEMA: rides
      DATABASE_URL: ${DATABASE_URL:-postgres://uber:localdev2026@postgres:5432/uber_clone}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:19092}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    <<: *service-defaults
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: payment-service
    environment:
      SERVICE_NAME: payment-service
      PORT: 3005
      DB_SCHEMA: payments
      DATABASE_URL: ${DATABASE_URL:-postgres://uber:localdev2026@postgres:5432/uber_clone}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:19092}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  realtime-service:
    <<: *service-defaults
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: realtime-service
    environment:
      SERVICE_NAME: realtime-service
      PORT: 3006
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:19092}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    <<: *service-defaults
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: notification-service
    environment:
      SERVICE_NAME: notification-service
      PORT: 3007
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:19092}
    depends_on:
      kafka:
        condition: service_healthy

  api-gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      ride-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      realtime-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/proxy_params:/etc/nginx/proxy_params:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  backend:
    driver: bridge
