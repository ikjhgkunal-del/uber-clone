events {}

http {
  log_format safe_request '$remote_addr "$request_method $uri" $status';
  access_log /var/log/nginx/access.log safe_request;

  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream auth_backend           { server auth-service:3001; }

  upstream frontend_backend { server frontend:80; }

  server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    location = /health {
      default_type application/json;
      return 200 '{"service":"api-gateway","status":"ok"}';
    }

    location /api/auth/ {
      proxy_pass http://auth_backend/;
      include /etc/nginx/proxy_params;
    }

    location /api/users/ {
      set $user_target user-service:3002;
      rewrite ^/api/users/(.*)$ /$1 break;
      proxy_pass http://$user_target;
      include /etc/nginx/proxy_params;
    }

    location /api/drivers/ {
      set $driver_target driver-service:3003;
      rewrite ^/api/drivers/(.*)$ /$1 break;
      proxy_pass http://$driver_target;
      include /etc/nginx/proxy_params;
    }

    location /api/rides/ {
      set $ride_target ride-service:3004;
      rewrite ^/api/rides/(.*)$ /$1 break;
      proxy_pass http://$ride_target;
      include /etc/nginx/proxy_params;
    }

    location /api/payments/ {
      set $payment_target payment-service:3005;
      rewrite ^/api/payments/(.*)$ /$1 break;
      proxy_pass http://$payment_target;
      include /etc/nginx/proxy_params;
    }

    location = /ws {
      set $realtime_target realtime-service:3006;
      proxy_pass http://$realtime_target;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://frontend_backend;
      include /etc/nginx/proxy_params;
    }
  }
}
